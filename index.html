<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Comprá productos de La Cosecha por el Trigal." />
    <meta name="theme-color" content="#fef9f3" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>TIENDA | La Cosecha</title>
    <style>
      :root {
        --ink: hsl(270 2% 25%);
        --brown: hsl(32 24% 31%);
        --cream: #f9f6f1;
        --green: hsl(121 33% 35%);
        --page-background: #fef4ef;
        --radius: .5rem;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; background: var(--page-background); color: var(--ink); font-family: "Open Sans", Arial, sans-serif; }
      button, input { font: inherit; }

      .hero {
        align-items: center;
        background: var(--page-background);
        display: grid;
        gap: 2rem;
        justify-items: center;
        padding: 3rem 1.5rem 0rem;
        text-align: center;
      }
      .hero h1 {
        color: var(--brown);
        font-family: Georgia, serif;
        font-size: clamp(2.5rem, 6vw, 5rem);
        line-height: 1;
        margin: 0;
      }
      .hero img { display: block; max-width: min(26rem, 85vw); width: 100%; }

      #shop { display: grid; gap: 3rem; padding: 3rem 1.5rem 5rem; }
      .categories { display: flex; flex-flow: row wrap; gap: 1rem; justify-content: center; }
      .btn {
        border: 1px solid currentColor;
        border-radius: var(--radius);
        background: transparent;
        color: inherit;
        cursor: pointer;
        display: inline-block;
        padding: .5rem 1.2rem;
        text-decoration: none;

        &.slim {
          padding: .5rem 0
        }
      }


      .btn:focus-visible, summary:focus-visible, input:focus-visible {
        outline: 2px solid var(--brown);
        outline-offset: 3px;
      }
      .category { scroll-margin-top: 2rem; }
      .category-title {
        font-family: Georgia, serif;
        font-size: clamp(2rem, 4vw, 2.2rem);
        line-height: 1.1;
        margin-block: 1.5rem;
        text-align: center;
      }
      .products { display: flex; flex-wrap: wrap; gap: 4rem 1rem; justify-content: center; }
      .product-card {
        display: flex;
        flex: 0 1 20rem;
        flex-direction: column;
        gap: .5rem;
        max-width: 20rem;
        min-width: 10rem;
        text-align: center;
      }
      .product-card img { aspect-ratio: 1; border-radius: var(--radius); display: block; object-fit: contain; width: 100%; }
      .product-card__body { padding: 0 1rem; }
      .product-card h2 { font-size: 1rem; margin: .5rem 0; font-weight: normal; }
      .price { margin: 0 0 1.2rem; font-size: 1.2rem; font-weight: bold;}
      details { margin-bottom: 1rem; }
      summary { cursor: pointer; }
      details p { line-height: 1.5; margin: .75rem 0 0; text-align: left; white-space: pre-line; }
      .add-to-cart { background: var(--brown); color: var(--cream); width: 100%; }
      .add-to-cart:hover { background: var(--green); }
      .status { margin: 0; text-align: center; }

      .cart-toggle {
        align-items: center;
        background: var(--cream);
        border: 1px solid color-mix(in srgb, var(--ink) 20%, transparent);
        border-radius: 50%;
        box-shadow: 0 4px 16px rgb(0 0 0 / .14);
        cursor: pointer;
        display: flex;
        height: 3.5rem;
        justify-content: center;
        padding: .75rem;
        position: fixed;
        right: 1.25rem;
        top: 1.25rem;
        width: 3.5rem;
        z-index: 1;
      }
      .cart-toggle img { height: 1.5rem; width: auto; }
      .cart-badge {
        align-items: center;
        background: var(--brown);
        border-radius: 50%;
        color: white;
        display: none;
        font-size: .7rem;
        font-weight: bold;
        height: 1.3rem;
        justify-content: center;
        position: absolute;
        right: -.3rem;
        top: -.3rem;
        width: 1.3rem;
      }
      .cart-badge:not(:empty) { display: flex; }

      dialog {
        border: 0;
        border-radius: var(--radius);
        box-shadow: 0 1rem 3rem rgb(0 0 0 / .28);
        color: var(--ink);
        max-height: min(90dvh, 48rem);
        padding: 2rem;
        width: min(90vw, 37.5rem);
      }
      dialog::backdrop { background: rgb(0 0 0 / .5); }
      .cart-close { border: 0; background: none; cursor: pointer; font-size: 2rem; line-height: 1; position: absolute; right: 1rem; top: 1rem; }
      .cart-title { font-family: Georgia, serif; font-size: 2rem; margin: 0 2rem 2rem 0; text-transform: uppercase; }
      .cart-items { display: grid; gap: 1rem; }
      .cart-item { align-items: center; display: grid; gap: .75rem; grid-template-columns: 4.5rem 1fr auto; }
      .cart-item img { aspect-ratio: 1; border-radius: var(--radius); object-fit: cover; width: 100%; }
      .cart-item h2, .cart-item p { margin: 0; }
      .cart-item h2 { font-size: 1rem; }
      .quantity-control { align-items: center; border: 1px solid color-mix(in srgb, var(--ink) 35%, transparent); border-radius: var(--radius); display: grid; grid-template-columns: 2.5rem 3rem 2.5rem; overflow: hidden; min-width: max-content;}
      .cart-item input { appearance: textfield; border: 0; background: transparent; padding: .55rem 0; text-align: center; width: 3rem; }
      .cart-item input::-webkit-inner-spin-button { appearance: none; }
      .quantity-button { border: 0; background: transparent; color: var(--brown); cursor: pointer; font-size: 1.8rem; font-weight: 300; line-height: 1; padding: .35rem; }
      .quantity-button:hover { background: var(--cream); color: var(--green); }
      .quantity-button:disabled { cursor: default; opacity: .5; }
      .checkout-details { display: grid; gap: .75rem; margin-top: 1.5rem; }
      .checkout-details label { display: grid; gap: .3rem; font-weight: bold; }
      .checkout-details input { border: 1px solid #aaa; border-radius: var(--radius); padding: .6rem; width: 100%; }
      .cart-total { font-family: Georgia, serif; font-size: 1.35rem; margin: 2rem 0 0; text-align: right; }
      .checkout { background: var(--brown); color: var(--cream); display: block; margin: 1.5rem auto 0; text-align: center; width: fit-content; }
      .checkout:hover { background: var(--green); }
      .checkout:disabled { cursor: wait; opacity: .65; }
      .checkout-status { color: #9c2f2f; margin: 1rem 0 0; text-align: center; }
      .cart-empty { margin: 0; text-align: center; }

      @media (max-width: 47.999rem) {
        .products { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2rem .75rem; }
        .product-card { min-width: 0; width: 100%; }
        .product-card__body { padding-inline: .25rem; }
      }

      @media (min-width: 48rem) { #shop { padding-top: 4rem; } }
    </style>
  </head>
  <body>
    <button class="cart-toggle" id="cart-toggle" type="button" aria-label="Abrir carrito">
      <img src="shopping-bag.svg" alt="" />
      <span class="cart-badge" id="cart-badge" aria-hidden="true"></span>
    </button>

    <dialog id="cart" aria-labelledby="cart-title">
      <form id="checkout-form">
        <button class="cart-close" id="cart-close" type="button" aria-label="Cerrar carrito">×</button>
        <h1 class="cart-title" id="cart-title">Tu carrito</h1>
        <div class="cart-items" id="cart-items"></div>
        <p class="cart-total" id="cart-total" hidden></p>
        <div class="checkout-details" id="customer-details" hidden>
          <label>Nombre <input id="customer-name" name="name" type="text" autocomplete="name" required /></label>
          <label>Teléfono <input id="customer-phone" name="phone" type="tel" autocomplete="tel" required /></label>
        </div>
        <button class="btn checkout" id="checkout" type="submit" hidden>Confirmar pedido por WhatsApp</button>
        <p class="checkout-status" id="checkout-status" role="status" hidden></p>
      </form>
    </dialog>

    <main id="main-content">
      <section class="hero" aria-labelledby="hero-title">
        <h1 id="hero-title" alt="la cosecha">
          <img src="hero.webp" alt="La Cosecha en apoyo al trigal" />
        </h1>
        <p id="announcement" style="font-weight: bolder;"></p>
      </section>

      <article id="shop">
        <nav class="categories" id="categories" aria-label="Categorías de productos"></nav>
        <p class="status" id="status" role="status">Cargando productos…</p>
        <div id="product-categories"></div>
      </article>
    </main>

    <script type="module">
      import { getGoogleSheetData } from "/utils/sheets.js";

      const SHEET_ID = "19bb7iz5XcJv8VyaGQjQgWQPn6INEES8ScOiTmDZ6QZ0";
      const SHEET_GID = "0";
      const SHEET_CONFIG_GID = "1740569694";
      const CART_STORAGE_KEY = "lacosechaCartItems";
      const CUSTOMER_STORAGE_KEY = "lacosechaCheckout";
      const CATALOG_STORAGE_KEY = "lacosechaCatalog";
      const VOLUNTARY_SUBDOMAIN = "voluntarios";
      const IS_VOLUNTARY_PAGE = location.hostname.startsWith(VOLUNTARY_SUBDOMAIN);
      let whatsappNumber = "";
      const ORDER_REQUEST_API_ENDPOINT = "https://script.google.com/macros/s/AKfycbx5pd4tzA8EdoIPDi8vflOAPauripR8TCCxiJy5Far8GXNdC816j3n1L4VFPtoqPKdQ/exec" + `?endpoint=createPurchaseOrderProposal`;
      // Change only this map if the spreadsheet column names change.
      const SHEET_COLUMN_TO_FIELD = Object.freeze({
        ID: "id",
        ACTIVO: "active",
        PROVEEDOR: "category",
        PRODUCTO: "title",
        UNIDAD_VENTA: "unit",
        PVP: "price", // Price for general public
        PVV: "priceV", // Price for voluntary
        DESCRIPCION: "description",
        IMAGEN_URL: "imageUrl",
      });
      // The sheet currently exposes its B-column header as FALSE (a checkbox), not ACTIVO.
      const products = new Map();
      let canCheckout = navigator.onLine;
      let hasConfig = false;
      const categories = document.getElementById("categories");
      const productCategories = document.getElementById("product-categories");
      const status = document.getElementById("status");
      const announcement = document.getElementById("announcement");
      const cart = document.getElementById("cart");
      const cartItems = document.getElementById("cart-items");
      const checkoutForm = document.getElementById("checkout-form");
      const customerDetails = document.getElementById("customer-details");
      const customerName = document.getElementById("customer-name");
      const customerPhone = document.getElementById("customer-phone");
      const cartTotal = document.getElementById("cart-total");
      const checkout = document.getElementById("checkout");
      const checkoutStatus = document.getElementById("checkout-status");
      const cartBadge = document.getElementById("cart-badge");

      const element = (tag, text, className) => {
        const node = document.createElement(tag);
        if (text) node.textContent = text;
        if (className) node.className = className;
        return node;
      };

      function imageUrl(value) {
        const url = String(value || "").trim();
        const match = url.match(/\/d\/([\w-]+)/);
        return match ? `https://drive.google.com/thumbnail?sz=w600&id=${match[1]}` : url;
      }

      function isActive(value) {
        return value === true || String(value).trim().toUpperCase() === "TRUE";
      }

      function getCachedCatalog() {
        try {
          const value = JSON.parse(localStorage.getItem(CATALOG_STORAGE_KEY) || "[]");
          return Array.isArray(value) ? value : [];
        } catch {
          return [];
        }
      }

      function saveCatalog(data) {
        localStorage.setItem(CATALOG_STORAGE_KEY, JSON.stringify(data));
      }

      function getCart() {
        try {
          const value = JSON.parse(localStorage.getItem(CART_STORAGE_KEY) || "[]");
          return Array.isArray(value) ? value : [];
        } catch {
          return [];
        }
      }

      function getCounts() {
        return getCart().reduce((counts, id) => {
          counts[id] = (counts[id] || 0) + 1;
          return counts;
        }, {});
      }

      function getCustomerDetails() {
        try {
          const value = JSON.parse(localStorage.getItem(CUSTOMER_STORAGE_KEY) || "{}");
          return { name: String(value.name || ""), phone: String(value.phone || "") };
        } catch {
          return { name: "", phone: "" };
        }
      }

      function saveCustomerDetails() {
        localStorage.setItem(CUSTOMER_STORAGE_KEY, JSON.stringify({
          name: customerName.value.trim(),
          phone: customerPhone.value.trim(),
        }));
      }

      function restoreCustomerDetails() {
        const { name, phone } = getCustomerDetails();
        customerName.value = name;
        customerPhone.value = phone;
      }

      function setCart(items) {
        localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(items));
        updateCart();
      }

      function addToCart(id) {
        setCart([...getCart(), id]);
      }

      function setQuantity(id, quantity) {
        const items = getCart();
        const position = items.indexOf(id);
        const nextItems = items.filter((item) => item !== id);
        nextItems.splice(position, 0, ...Array(quantity).fill(id));
        setCart(nextItems);
      }

      function updateProductButtons() {
        const counts = getCounts();
        document.querySelectorAll(".add-to-cart").forEach((button) => {
          const count = counts[button.dataset.id] || 0;
          button.textContent = count ? `${count} en el carrito` : "Agregar al carrito";
          button.style.background = count ? "var(--green)" : "";
        });
      }

      function renderCart() {
        const counts = getCounts();
        const totalCount = Object.values(counts).reduce((total, count) => total + count, 0);
        cartBadge.textContent = totalCount || "";
        cartItems.replaceChildren();
        checkoutStatus.hidden = true;

        if (!totalCount) {
          cartItems.append(element("p", "Tu carrito está vacío.", "cart-empty"));
          customerDetails.hidden = true;
          cartTotal.hidden = true;
          checkout.hidden = true;
          return;
        }

        let total = 0;
        for (const [id, quantity] of Object.entries(counts)) {
          const product = products.get(id);
          if (!product) continue;
          total += Number(getProductPrice(product)) * quantity;
          const item = element("article", "", "cart-item");
          const image = document.createElement("img");
          image.src = imageUrl(product.imageUrl);
          image.alt = "";
          const description = element("div");
          description.append(element("h2", product.title), element("p", `$ ${Number(getProductPrice(product)).toLocaleString('es-AR', { maximumFractionDigits: 0 })}`));
          const input = document.createElement("input");
          input.type = "number";
          input.min = "0";
          input.max = "99";
          input.value = quantity;
          input.setAttribute("aria-label", `Cantidad de ${product.title}`);
          input.addEventListener("change", () => {
            const value = Number.parseInt(input.value, 10);
            setQuantity(id, Number.isInteger(value) && value >= 0 && value <= 99 ? value : quantity);
          });
          const quantityControl = element("div", "", "quantity-control");
          const decrease = element("button", "−", "quantity-button");
          decrease.type = "button";
          decrease.setAttribute("aria-label", `Quitar una unidad de ${product.title}`);
          decrease.addEventListener("click", () => setQuantity(id, quantity - 1));
          const increase = element("button", "+", "quantity-button");
          increase.type = "button";
          increase.disabled = quantity >= 99;
          increase.setAttribute("aria-label", `Agregar una unidad de ${product.title}`);
          increase.addEventListener("click", () => setQuantity(id, quantity + 1));
          quantityControl.append(decrease, input, increase);
          item.append(image, description, quantityControl);
          cartItems.append(item);
        }
        customerDetails.hidden = false;
        cartTotal.hidden = false;
        cartTotal.textContent = `Total: $ ${total.toLocaleString('es-AR', { maximumFractionDigits: 0 })}`;
        checkout.hidden = !canCheckout || !hasConfig;
        if (!canCheckout) {
          checkoutStatus.textContent = "Necesitás conexión para confirmar el pedido.";
          checkoutStatus.hidden = false;
        }
      }

      function getOrderRequest() {
        const items = Object.entries(getCounts()).flatMap(([id, quantity]) => {
          const product = products.get(id);
          const unitPrice = Number(getProductPrice(product));
          return Number.isFinite(unitPrice) ? [{ id, quantity, unitPrice }] : [];
        });
        return {
          name: customerName.value.trim(),
          phone: customerPhone.value.trim(),
          isVolunteer: IS_VOLUNTARY_PAGE,
          items,
        };
      }

      function getWhatsAppUrl(order, proposalId) {
        const total = order.items.reduce((sum, item) => sum + item.quantity * item.unitPrice, 0);
        const orderLines = order.items.map(({ id, quantity, unitPrice }) => {
          const product = products.get(id);
          return `${quantity} x ${product?.title || id} ($ ${unitPrice.toLocaleString('es-AR', { maximumFractionDigits: 0 })} c/u)`;
        });
        const message = [
          "Pedido de La Cosecha:",
          `N° de pedido: ${proposalId}`,
          "",
          `Nombre: ${order.name}`,
          `Teléfono: ${order.phone}`,
          "",
          ...orderLines,
          "",
          `*Total: $ ${total.toLocaleString('es-AR', { maximumFractionDigits: 0 })}*`,
        ].join("\n");
        return `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;
      }

      async function saveOrderRequest(order) {
        const response = await fetch(ORDER_REQUEST_API_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=UTF-8" },
          body: JSON.stringify(order),
        });
        const result = await response.json();
        if (!response.ok || !result.success) {
          const error = new Error(result.message || "No se pudo guardar el pedido.");
          error.code = result.code || "REQUEST_FAILED";
          throw error;
        }
        const proposalId = String(result.data?.id || "").trim();
        if (!proposalId) {
          const error = new Error("El pedido se guardó sin identificador.");
          error.code = "INVALID_RESPONSE";
          throw error;
        }
        return proposalId;
      }

      function updateCart() {
        updateProductButtons();
        renderCart();
      }

      function getProductPrice(product) {
        if (IS_VOLUNTARY_PAGE) return product.priceV
        return product.price;
      }

      function renderProduct(product) {
        const card = element("article", "", "product-card");
        Object.entries(product).forEach(([field, value]) => { card.dataset[field] = value; });
        const url = imageUrl(product.imageUrl);
        if (url) {
          const image = document.createElement("img");
          image.src = url;
          image.alt = product.title;
          image.loading = "lazy";
          card.append(image);
        }

        const body = element("div", "", "product-card__body");
        body.append(element("h2", product.title), element("p", `$ ${getProductPrice(product).toLocaleString('es-AR', { maximumFractionDigits: 0 })}`, "price"));
        if (String(product.description).trim()) {
          const details = document.createElement("details");
          details.append(element("summary", "Más detalles"), element("p", product.description));
          body.append(details);
        }

        const button = element("button", "Agregar al carrito", "btn slim add-to-cart");
        button.type = "button";
        button.dataset.id = product.id;
        button.addEventListener("click", () => addToCart(product.id));
        body.append(button);
        card.append(body);
        return card;
      }

      function mapProduct(row) {
        return Object.fromEntries(Object.entries(row).flatMap(([header, value]) => {
          const field = SHEET_COLUMN_TO_FIELD[header];
          return field ? [[field, value]] : [];
        }));
      }

      function renderProducts(data, notice = "") {
        products.clear();
        categories.replaceChildren();
        productCategories.replaceChildren();
        const grouped = new Map();
        for (const product of data) {
          if (!isActive(product.active) || !product.id || !product.title || !product.category) continue;
          products.set(product.id, product);
          grouped.set(product.category, [...(grouped.get(product.category) || []), product]);
        }

        for (const [name, categoryProducts] of grouped) {
          const id = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
          const link = element("a", name, "btn");
          link.href = `#${id}`;
          categories.append(link);

          const section = element("section", "", "category");
          section.id = id;
          const heading = element("h3", name, "category-title");
          const list = element("div", "", "products");
          categoryProducts.forEach((product) => list.append(renderProduct(product)));
          section.append(heading, list);
          productCategories.append(section);
        }
        status.hidden = !notice;
        if (notice) status.textContent = notice;
        updateCart();
      }

      async function loadConfig() {
        try {
          const [config] = await getGoogleSheetData(SHEET_ID, SHEET_CONFIG_GID);
          whatsappNumber = String(config?.WhatsApp || "").trim();
          announcement.textContent = String(config?.Anuncio || "").trim();
          hasConfig = Boolean(whatsappNumber);
          updateCart();
        } catch (error) {
          hasConfig = false;
          console.error("No se pudo cargar la configuración:", error);
        }
      }

      async function loadProducts() {
        try {
          const rows = await getGoogleSheetData(SHEET_ID, SHEET_GID);
          const data = rows.map(mapProduct);
          canCheckout = true;
          saveCatalog(data);
          renderProducts(data);
        } catch (error) {
          canCheckout = false;
          const cachedCatalog = getCachedCatalog();
          if (cachedCatalog.length) {
            renderProducts(cachedCatalog, "Sin conexión: mostrando el catálogo guardado.");
          } else {
            status.textContent = "No se pudieron cargar los productos. Conectate y probá nuevamente.";
          }
          console.error("No se pudieron cargar los productos:", error);
        }
      }

      document.getElementById("cart-toggle").addEventListener("click", () => cart.showModal());
      document.getElementById("cart-close").addEventListener("click", () => cart.close());
      cart.addEventListener("click", (event) => { if (event.target === cart) cart.close(); });
      checkoutForm.addEventListener("input", saveCustomerDetails);
      checkoutForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!canCheckout || !hasConfig) {
          checkoutStatus.textContent = !canCheckout
            ? "Necesitás conexión para confirmar el pedido."
            : "No se pudo cargar la configuración del pedido.";
          checkoutStatus.hidden = false;
          return;
        }
        if (!checkoutForm.reportValidity()) return;

        saveCustomerDetails();
        const order = getOrderRequest();
        const whatsappWindow = window.open("", "_blank");
        checkout.disabled = true;
        checkout.textContent = "Guardando pedido…";
        checkoutStatus.hidden = true;

        try {
          const proposalId = await saveOrderRequest(order);
          const whatsappUrl = getWhatsAppUrl(order, proposalId);
          setCart([]);
          if (whatsappWindow) whatsappWindow.location.assign(whatsappUrl);
          else window.location.assign(whatsappUrl);
        } catch (error) {
          whatsappWindow?.close();
          checkoutStatus.textContent = error.code === "PRICE_CHANGED"
            ? "Los precios cambiaron. Recargá la página para ver el total actualizado."
            : "No se pudo guardar el pedido. Intentá nuevamente.";
          checkoutStatus.hidden = false;
          console.error("No se pudo guardar el pedido:", error);
        } finally {
          checkout.disabled = false;
          checkout.textContent = "Confirmar pedido por WhatsApp";
        }
      });
      window.addEventListener("online", () => {
        canCheckout = true;
        updateCart();
        loadProducts();
        loadConfig();
      });
      window.addEventListener("offline", () => {
        canCheckout = false;
        updateCart();
      });
      window.addEventListener("storage", (event) => {
        if (event.key === CART_STORAGE_KEY) updateCart();
        if (event.key === CUSTOMER_STORAGE_KEY) {
          restoreCustomerDetails();
        }
      });
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/service-worker.js").catch((error) => {
          console.error("No se pudo registrar el modo sin conexión:", error);
        });
      }
      restoreCustomerDetails();
      loadProducts();
      loadConfig();
    </script>
  </body>
